<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sixth Ward Tool Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dist/styles.css">
</head>
<body class="min-h-screen bg-surface font-body text-ink antialiased">
  <header class="border-b border-border bg-surface-raised">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-md py-md">
      <a class="font-display text-xl text-ink" href="index.html">Sixth Ward Tool Library</a>
      <a class="text-sm font-medium text-accent underline-offset-4 hover:underline" href="index.html" aria-current="page">Catalog</a>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-md py-xl">
    <section aria-labelledby="catalog-heading">
      <div class="mb-lg flex items-end justify-between gap-md">
        <h1 id="catalog-heading" class="font-display text-xl">Tool catalog</h1>
        <p id="result-count" class="text-sm text-ink-muted" role="status" aria-live="polite">Loading tools...</p>
      </div>
      <form id="catalog-filters" class="mb-lg grid grid-cols-1 gap-md rounded-card border border-border bg-surface-raised p-md lg:grid-cols-3" role="search" aria-label="Filter tools">
        <label class="flex flex-col gap-xs text-sm font-medium text-ink" for="category-filter">
          Category
          <select id="category-filter" class="w-full rounded-sm border border-border bg-surface-raised px-sm py-sm font-body text-sm font-normal text-ink">
            <option value="">All categories</option>
          </select>
        </label>
        <label class="flex items-center gap-sm text-sm font-medium text-ink">
          <input id="available-filter" class="h-4 w-4 accent-accent" type="checkbox">
          Available only
        </label>
        <label class="flex flex-col gap-xs text-sm font-medium text-ink" for="name-filter">
          Tool name
          <input id="name-filter" class="w-full rounded-sm border border-border bg-surface-raised px-sm py-sm font-body text-sm font-normal text-ink placeholder:text-ink-muted" type="search" placeholder="Search tools">
        </label>
      </form>
      <div id="empty-state" class="mb-lg hidden rounded-card border border-border bg-surface-raised p-lg text-center">
        <p class="mb-md text-base text-ink">No tools match these filters.</p>
        <button id="clear-filters" class="rounded-sm bg-accent px-md py-sm text-sm font-medium text-accent-ink transition-colors hover:bg-accent-hover" type="button">Clear filters</button>
      </div>
      <div id="tool-grid" class="grid grid-cols-1 gap-md lg:grid-cols-3" aria-label="Tools"></div>
      <p id="load-error" class="mt-lg hidden text-sm text-status-repair" role="alert">The catalog could not be loaded. Please try again.</p>
    </section>
  </main>

  <script>
    const availabilityDetails = {
      available: { label: "Available", classes: "bg-status-available-bg text-status-available" },
      checked_out: { label: "Checked out", classes: "bg-status-out-bg text-status-out" },
      repair: { label: "Under repair", classes: "bg-status-repair-bg text-status-repair" }
    };

    async function renderCatalog() {
      const grid = document.querySelector("#tool-grid");
      const resultCount = document.querySelector("#result-count");
      const loadError = document.querySelector("#load-error");
      const categoryFilter = document.querySelector("#category-filter");
      const availableFilter = document.querySelector("#available-filter");
      const nameFilter = document.querySelector("#name-filter");
      const emptyState = document.querySelector("#empty-state");
      const filters = document.querySelector("#catalog-filters");
      const clearFilters = document.querySelector("#clear-filters");

      try {
        const response = await fetch("data/tools.json");
        if (!response.ok) throw new Error("Catalog request failed");

        const data = await response.json();
        const categoryLabels = new Map(data.categories.map((category) => [category.id, category.label]));
        data.categories.forEach((category) => {
          const option = document.createElement("option");
          option.value = category.id;
          option.textContent = category.label;
          categoryFilter.append(option);
        });
        const tools = data.tools.filter((tool) => tool.availability !== "retired");

        function renderTools() {
          const query = nameFilter.value.trim().toLocaleLowerCase();
          const filteredTools = tools.filter((tool) =>
            (!categoryFilter.value || tool.category === categoryFilter.value) &&
            (!availableFilter.checked || tool.availability === "available") &&
            (!query || tool.name.toLocaleLowerCase().includes(query))
          );

          resultCount.textContent = `${filteredTools.length} ${filteredTools.length === 1 ? "tool" : "tools"}`;
          emptyState.classList.toggle("hidden", filteredTools.length > 0);
          grid.classList.toggle("hidden", filteredTools.length === 0);
          grid.replaceChildren(...filteredTools.map((tool) => {
          const availability = availabilityDetails[tool.availability];
          const card = document.createElement("a");
          card.href = `tool.html?id=${encodeURIComponent(tool.id)}`;
          card.className = "flex h-[386px] w-[320px] flex-col overflow-hidden rounded-card border border-border bg-surface-raised p-0 font-body transition-colors hover:border-accent-hover";

          const top = document.createElement("div");
          top.className = "flex min-h-0 w-full flex-1 items-center justify-center bg-surface";

          const icon = document.createElement("img");
          icon.src = `images/${encodeURIComponent(tool.category)}.svg`;
          icon.alt = "";
          icon.width = 64;
          icon.height = 64;
          icon.className = "h-16 w-16 shrink-0";

          const badge = document.createElement("span");
          badge.className = `mx-md mb-sm self-start rounded-full px-sm py-xs text-xs font-medium ${availability.classes}`;
          badge.textContent = availability.label;
          top.append(icon);

          const category = document.createElement("p");
          category.className = "mx-md mt-md text-sm text-ink-muted";
          category.textContent = categoryLabels.get(tool.category) ?? tool.category;

          const name = document.createElement("h2");
          name.className = "mx-md mb-xs font-display text-lg font-semibold text-ink";
          name.textContent = tool.name;

          const availabilityTimeframe = document.createElement("p");
          availabilityTimeframe.className = "mx-md mb-md text-sm text-ink";
          if (tool.availability === "checked_out" && tool.due_back) {
            const [year, month, day] = tool.due_back.split("-").map(Number);
            const dueDate = new Date(year, month - 1, day);
            availabilityTimeframe.textContent = `Due back ${dueDate.toLocaleDateString("en-US", { month: "long", day: "numeric" })}`;
          } else if (tool.availability === "repair") {
            availabilityTimeframe.textContent = "Unavailable while under repair";
          } else {
            availabilityTimeframe.textContent = "Ready to borrow now";
          }

          card.append(top, category, name, badge, availabilityTimeframe);
          return card;
          }));
        }

        filters.addEventListener("submit", (event) => event.preventDefault());
        categoryFilter.addEventListener("change", renderTools);
        availableFilter.addEventListener("change", renderTools);
        nameFilter.addEventListener("input", renderTools);
        clearFilters.addEventListener("click", () => {
          filters.reset();
          renderTools();
          categoryFilter.focus();
        });
        renderTools();
      } catch {
        resultCount.textContent = "";
        loadError.classList.remove("hidden");
      }
    }

    renderCatalog();
  </script>
</body>
</html>
